name: slayerfs tests

on:
  pull_request:
    paths:
      - "project/slayerfs/**"
      - "project/rfuse3/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "project/slayerfs/**"
      - "project/rfuse3/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"

jobs:
  unit-and-integration:
    name: slayerfs basic test
    runs-on: [self-hosted]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_DEBUG: 1
      LIBGUESTFS_TRACE: 1
      LIBVIRT_DEFAULT_URI: qemu:///system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            pkg-config \
            libssl-dev \
            protobuf-compiler \
            qemu-system-x86 \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-daemon-driver-qemu \
            libvirt-clients \
            dnsmasq-base \
            guestfish \
            libguestfs-tools \
            supermin \
            xorriso

      - name: Prepare hosted virtualization environment (test/*)
        if: ${{ startsWith(github.ref, 'refs/heads/test/') }}
        run: |
          KREL="$(uname -r)"
          sudo chmod a+r "/boot/vmlinuz-${KREL}" || true
          sudo chmod a+r /boot/vmlinuz-* || true
          echo "SUPERMIN_KERNEL=/boot/vmlinuz-${KREL}" >> "$GITHUB_ENV"
          echo "SUPERMIN_MODULES=/lib/modules/${KREL}" >> "$GITHUB_ENV"

          sudo systemctl enable --now libvirtd || sudo service libvirtd start
          sudo systemctl enable --now virtlogd || sudo service virtlogd start || true
          echo "/usr/sbin" >> "$GITHUB_PATH"
          sudo chgrp "$(id -gn)" /var/run/libvirt/libvirt-sock || true
          sudo chmod g+rw /var/run/libvirt/libvirt-sock || true
          which dnsmasq || true
          dnsmasq --version | head -n 1 || true
          virsh -c qemu:///system uri
          virsh -c qemu:///system net-list --all || true

      - name: Start backend services
        run: |
          docker compose -f project/slayerfs/docker-compose.yml up -d

      - name: Run tests
        run: |
          cd project
          cargo build -p slayerfs --example persistence_demo --release
          cargo test -p slayerfs --test test_slayerfs_qlean_multinode_smoke -- --ignored

      - name: Stop backend services
        if: always()
        run: |
          docker compose -f project/slayerfs/docker-compose.yml down -v

      - name: Install nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --force

      - name: Fuzz explore (fs_ops)
        timeout-minutes: 30
        run: |
          cd project/slayerfs
          cargo +nightly fuzz build fs_ops
          BIN=$(find fuzz/target -type f -path "*/release/fs_ops" | head -n 1)
          echo "Using fuzz binary: ${BIN}"

          # CI clone may not contain local/untracked corpus dirs; create them defensively.
          mkdir -p fuzz/corpus/fs_ops fuzz/artifacts/fs_ops

          set +e
          "${BIN}" -artifact_prefix=fuzz/artifacts/fs_ops/ fuzz/corpus/fs_ops -rss_limit_mb=1024 -max_total_time=180 -max_len=1024 -print_final_stats=1
          status=$?
          set -e

          # libFuzzer exits with code 71 when hitting the RSS cap.
          if [ "${status}" -eq 71 ]; then
            echo "Stopped at RSS limit (expected)."
            exit 0
          fi

          exit "${status}"

      - name: Cleanup slayerfs fuzz outputs (always)
        if: always()
        run: |
          cd project/slayerfs
          rm -rf fuzz/artifacts/fs_ops/*
          rm -rf fuzz/.tmp*

  xfstests:
    name: xfstests
    if: false
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libfuse3-dev fuse3 sqlite3 protobuf-compiler
          protoc --version

      - name: Build slayerfs persistence demo
        working-directory: project
        run: cargo build -p slayerfs --example persistence_demo --release

      - name: Run xfstests
        run: |
          chmod +x project/slayerfs/tests/scripts/xfstests_slayer.sh
          project/slayerfs/tests/scripts/xfstests_slayer.sh

      - name: Upload xfstests artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slayerfs-xfstests-logs
          path: |
            /tmp/slayerfs.log
            /tmp/xfstests-dev/results
            /tmp/xfstests-dev/local.config
          if-no-files-found: ignore
